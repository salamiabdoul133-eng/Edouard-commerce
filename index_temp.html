  <style>
    :root {
      --gold: #C8922A;
      --dark-brown: #2B1A0E;
      --cream: #FAF3E0;
      --green: #3A6B35;
      --light-green: #6BAF6B;
      --white: #FFFFFF;
      --wa-green: #25D366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--dark-brown);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    
    html{
      scroll-behavior: smooth;  
    }

    /* HERO */
    header {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--dark-brown) 0%, #4a2c10 50%, var(--green) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=1400') center/cover no-repeat;
      opacity: 0.18;
    }

    .hero-badge {
      background: var(--gold);
      color: var(--white);
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 0.4rem 1.4rem;
      border-radius: 2px;
      margin-bottom: 1.5rem;
      animation: fadeDown 0.8s ease both;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 6rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.1;
      animation: fadeDown 1s ease 0.2s both;
    }

    header h1 span { color: var(--gold); }

    header p.tagline {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: rgba(255,255,255,0.85);
      margin-top: 1.2rem;
      font-weight: 300;
      letter-spacing: 1px;
      animation: fadeDown 1s ease 0.4s both;
    }

    .hero-flags {
      margin-top: 1rem;
      font-size: 2rem;
      animation: fadeDown 1s ease 0.5s both;
    }

    .hero-cta {
      margin-top: 2.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeDown 1s ease 0.6s both;
    }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--wa-green);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    }

    .btn-wa:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(37,211,102,0.5); }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .btn-outline:hover { background: var(--gold); color: white; }

    /* ABOUT */
    .about {
      background: var(--white);
      padding: 5rem 2rem;
      text-align: center;
    }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .about h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: var(--dark-brown);
      margin-bottom: 1.2rem;
    }

    .about p {
      max-width: 650px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #555;
    }

    .trust-strip {
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
      margin-top: 3rem;
    }

    .trust-item { text-align: center; }

    .trust-item .num {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold);
    }

    .trust-item p { font-size: 0.9rem; color: #777; margin-top: 0.2rem; }

    /* PRODUCTS */
    .products {
      padding: 5rem 2rem;
      background: var(--cream);
    }

    .products-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .products-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: var(--dark-brown);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 6px 30px rgba(0,0,0,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
    }

    .card:hover { transform: translateY(-8px); box-shadow: 0 16px 40px rgba(0,0,0,0.25); }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    .card:hover img { transform: scale(1.07); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,10,0,0.85) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
    }

    .card-overlay h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--white);
    }

    .card-overlay p {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.75);
      margin-top: 0.3rem;
    }
    .droite {
     max-width: 300px;
    }
    .droite h1{
      font-size: 20px;
      margin-bottom:8px;
     }
     .droite p {
       margin-top: 14px;
      line-height: 1.4;
      }

    .card-wa {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.8rem;
      background: var(--wa-green);
      color: white;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      width: fit-content;
    }

    /* CONTACT */
    .contact {
      background: var(--dark-brown);
      color: var(--white);
      padding: 5rem 2rem;
      text-align: center;
    }

    .contact h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin-bottom: 1rem;
    }

    .contact p { color: rgba(255,255,255,0.7); margin-bottom: 2rem; font-size: 1.05rem; }
